[package]
name = "k3-polling-net-host"
version = "0.1.0"
edition = "2024"
publish = false

# MS11 Iteration 002 host package (tasks 3.1/3.2): the production K3 smoltcp
# polling Device/session and the stage 13 gate run against a fake board and a
# real-smoltcp memory peer. The package is excluded from the root workspace;
# its feature mirrors the kernel's `k3-polling-net` gate so
# `k3_gmac::polling_net` compiles as a child of the included `k3_gmac`
# module, exactly like kernel k3 builds.
[features]
default = ["k3-polling-net"]
k3-polling-net = []

[dependencies]
smoltcp = { path = "../../crates/smoltcp", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-tcp-reno",
    "auto-icmp-echo-reply",
] }
