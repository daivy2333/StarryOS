schema: spec-driven

# Project context
context: |
  Project type: no_std Rust operating-system kernel
  Tech stack: Rust nightly-2026-02-25, edition 2024, ArceOS 0.3.0-preview.2
  Platforms: RISC-V 64-bit QEMU virt and Lichee RV Dock D1, with multi-architecture manifests
  Domain: kernel, platform support, asynchronous UART, TTY/VFS integration, benchmark evidence
  Language: OpenSpec artifacts use Simplified Chinese; API, MMIO, ISR, IRQ, TTY and other technical terms remain in English

# Per-artifact rules
rules:
  proposal:
    - Proposals must cover Happy Path, Sad Path, Edge Case, Error/Timeout/Cancel paths
    - Must include BDD scenario sketches (pre-state, action, result, failure boundary)
    - Must identify authorization, capability, and stop boundaries when they affect execution
  specs:
    - Every Requirement must contain SHALL or MUST keyword
    - Every Requirement must have at least one Scenario with WHEN/THEN blocks
    - Requirements must preserve explicit user scope; simplifications require an approved traceability record
  design:
    - Design decisions must record decision, reason, impact, and alternatives
    - Designs must identify state ownership, concurrency/error boundaries, validation strategy, and stop conditions
  tasks:
    - Tasks must be atomic and independently verifiable
    - Each task must encode WHERE, WHY, HOW, and EXPECTED RESULT
    - Each task must name its test witness or verification evidence
