[workspace]
resolver = "2"
members = ["kernel"]
exclude = [
    "arceos",
    "crates/axtask",
    "crates/axdriver_net",
    "crates/axdriver_virtio",
    "crates/axnet",
    "crates/smoltcp",
    "crates/uart_16550",
    "crates/virtio-drivers",
    "tests/k3-polling-net-host",
    "tests/k3-embedded-user-host",
    "tests/k3-async-net-host",
]

[workspace.package]
version = "0.2.0-preview.2"
edition = "2024"
description = "A Linux-compatible OS kernel built on ArceOS unikernel"
license = "Apache-2.0"

authors = [
    "Azure-stars <Azure_stars@126.com>",
    "Yuekai Jia <equation618@gmail.com>",
    "KylinSoft Co., Ltd. <https://www.kylinos.cn/>",
    "朝倉水希 <asakuramizu111@gmail.com>",
    "Mivik <mivikq@gmail.com>",
]
homepage = "https://github.com/Starry-OS"
repository = "https://github.com/Starry-OS/StarryOS"

[workspace.dependencies]
axfeat = { version = "=0.3.0-preview.2" }

axalloc = { version = "=0.3.0-preview.2" }
axconfig = { version = "=0.3.0-preview.2" }
axdisplay = { version = "=0.3.0-preview.2" }
axdriver = { version = "=0.3.0-preview.2" }
axfs = { version = "=0.3.0-preview.2", package = "axfs-ng" }
axhal = { version = "=0.3.0-preview.2" }
axinput = { version = "=0.3.0-preview.2" }
axlog = { version = "=0.3.0-preview.2" }
axmm = { version = "=0.3.0-preview.2" }
axnet = { path = "crates/axnet", version = "=0.3.0-preview.2", package = "axnet-ng" }
axruntime = { version = "=0.3.0-preview.2" }
axsync = { version = "=0.3.0-preview.2" }
axtask = { version = "=0.3.0-preview.2" }

starry-kernel = { path = "kernel", version = "=0.2.0-preview.2" }

# K3 polling network session (MS11 Iteration 002): the local smoltcp crate
# with exactly the four-protocol feature set; no default features (no_std).
smoltcp = { path = "crates/smoltcp", version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-tcp-reno",
    "auto-icmp-echo-reply",
] }

[package]
name = "starryos"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
qemu = [
    "axfeat/defplat",
    "axfeat/bus-pci",

    "axfeat/display",

    "starry-kernel/input",
    "starry-kernel/vsock",

    # auxilary features
    "axfeat/fs-ng-times",
    "starry-kernel/dev-log",
    "starry-kernel/qemu",
]
lichee-d1 = [
    "dep:axplat-riscv64-lichee-d1",
    "dep:page_table_entry",
    "axplat-riscv64-lichee-d1/irq-if",
    "axfeat/bus-mmio",
    "starry-kernel/lichee-d1",
    "starry-kernel/lichee-d1-smoke",
]
lichee-d1-async-uart = [
    "dep:axplat-riscv64-lichee-d1",
    "dep:page_table_entry",
    "axplat-riscv64-lichee-d1/irq",
    "axfeat/bus-mmio",
    "starry-kernel/lichee-d1",
    "starry-kernel/lichee-d1-async-uart",
]
lichee-d1-kbench = [
    "lichee-d1-async-uart",
    "starry-kernel/lichee-d1-kbench",
]
lichee-d1-userbench = [
    "lichee-d1-async-uart",
    "axfeat/paging",
    "starry-kernel/lichee-d1-userbench",
]
lichee-d1-fullbench = [
    "lichee-d1-async-uart",
    "axfeat/paging",
    "starry-kernel/lichee-d1-fullbench",
]
lichee-d1-fullbench-command = [
    "lichee-d1-async-uart",
    "axfeat/paging",
    "starry-kernel/lichee-d1-fullbench-command",
]
smp = ["axfeat/smp", "starry-kernel/smp", "axplat-riscv64-visionfive2?/smp"]

vf2 = ["dep:axplat-riscv64-visionfive2", "axfeat/driver-sdmmc"]

k3 = [
    "dep:axplat-riscv64-k3",
    "axplat-riscv64-k3/irq-if",
    "axfeat/bus-mmio",
    # K3 adjudicated RAM window is 5.75 GiB kernel-managed; the default
    # page-alloc-4g bitmap (1M pages) overflows at axruntime init (board
    # panic, MS09 Iteration 002 3.3 first run). axallocator's cfg chain
    # prefers 64g over 4g when both are set, so other platforms are
    # unaffected.
    "axfeat/page-alloc-64g",
    "starry-kernel/k3",
]

# MS17 Iteration 000: K3 async UART mode — implies the polling `k3` shape and
# enables the platform runtime timer slot (`runtime-irq`) plus the opt-in
# UART42 route (`uart-irq`). Single-hart raw PXA port qualification; the
# polling network stages stay compiled but are not entered.
k3-async-uart = [
    "k3",
    "axplat-riscv64-k3/runtime-irq",
    "axplat-riscv64-k3/uart-irq",
    "starry-kernel/k3-async-uart",
]

# MS12 Iteration 000 (001-replan): K3 async GMAC data-plane mode (`make
# k3-async`) — implies the polling `k3` shape and enables the platform runtime
# timer slot (`runtime-irq`); the opt-in UART42 route stays off. The kernel
# opens the axdriver net/dyn edge and axnet; the dyn PCI probe callback is
# never invoked (the K3-limited `k3_klib` seam only satisfies the link).
# Single-hart only; mutually exclusive with every UART-mode shape.
k3-net-diagnostics = [
    "k3-async-net",
    "starry-kernel/k3-net-diagnostics",
]
k3-async-net = [
    "k3",
    "axplat-riscv64-k3/runtime-irq",
    "starry-kernel/k3-async-net",
]

# MS17 Iteration 000: the raw UART port qualification build (`make
# k3-uart-port`); implies the async mode and selects only the raw
# qualification entry.
k3-uart-port-test = ["k3-async-uart", "starry-kernel/k3-uart-port-test"]

# MS17 Iteration 001: K3 async UART data-plane mode (`make k3-uart`) —
# implies the raw-port async mode and opens the copier/ring data plane
# (uart_init K3 path over the Iteration 000 port). Single-hart. Iteration
# 002 opens the tty/userland tree in this shape; `k3-stdio` (T6) selects
# the embedded stdio probe boot path over it.
k3-uart = ["k3-async-uart", "axfeat/paging", "starry-kernel/k3-uart"]

# MS17 Iteration 002: K3 stdio userland shape (`make k3-stdio`) — the tty
# single-consumer boot path: copiers start, the memory root mounts
# (constructing ASYNC_TTY), the embedded probe is loaded and spawned with
# stdio, and the kernel physically drains after exit.
k3-stdio = ["k3-uart", "axfeat/paging", "starry-kernel/k3-stdio"]

# MS17 Iteration 003: K3 minimal interactive shell shape (`make k3-shell`) —
# implies the k3-stdio tty/userland shape and swaps the embedded payload to
# the minimal shell (help/echo/sleep/exit); single-hart only.
k3-shell = ["k3-stdio", "starry-kernel/k3-shell"]

# MS18 Iteration 000: K3 RAM-rootfs shape (`make k3-rootfs`) — implies the
# k3-uart data plane (copiers start; no k3-stdio/shell boot path) and passes
# the platform `ram-rootfs` reservation feature so the allocator keeps the
# rootfs and DTB carrying windows. Single-hart only; the ordinary ext4 root
# replaces the memory root for this shape.
k3-rootfs = [
    "k3-uart",
    "axplat-riscv64-k3/ram-rootfs",
    "starry-kernel/k3-rootfs",
]

[[bin]]
name = "starryos"
path = "src/main.rs"

[dependencies]
axfeat.workspace = true
starry-kernel.workspace = true

[dependencies.axplat-riscv64-visionfive2]
version = "0.1.0-pre.1"
features = ["fp-simd", "irq", "rtc"]
optional = true

[dependencies.axplat-riscv64-lichee-d1]
path = "crates/axplat-riscv64-lichee-d1"
optional = true

[dependencies.axplat-riscv64-k3]
path = "crates/axplat-riscv64-k3"
optional = true

[dependencies.page_table_entry]
version = "=0.6.1"
optional = true
features = ["xuantie-c9xx"]

[package.metadata.vendor-filter]
platforms = ["riscv64gc-unknown-none-elf", "loongarch64-unknown-none-softfloat"]

[patch.crates-io]
axtask = { path = "crates/axtask" }
axnet-ng = { path = "crates/axnet" }
axfs-ng = { path = "crates/axfs-ng" }
axdriver_net = { path = "crates/axdriver_net" }
axdriver_virtio = { path = "crates/axdriver_virtio" }
virtio-drivers = { path = "crates/virtio-drivers" }
