[package]
name = "axplat-riscv64-k3"
version = "0.1.0"
edition = "2024"
authors = ["StarryOS contributors"]
description = "axplat HAL implementation for SpacemiT K3 Com260 IFX"
license = "GPL-3.0-or-later OR Apache-2.0"
repository = "https://github.com/Starry-OS/StarryOS"

[features]
irq-if = ["axplat/irq"]
# MS17 Iteration 000 (task T1): the independent runtime timer slot. Implies
# the AIA external routing (the timer slot lives beside it, not in it).
runtime-irq = ["irq-if"]
# MS17 Iteration 000 (task T2): opt-in UART route (source/EID 42). The
# default AIA route table stays the four MS10 routes.
uart-irq = ["irq-if"]
# MS18 Iteration 000 (task 1.1): the RAM-rootfs boot shape reserves the
# rootfs carrying window and the DTB carrying window from the allocator.
# Every other mode keeps the empty reservation list.
ram-rootfs = []

[lib]
name = "axplat_riscv64_k3"
path = "src/lib.rs"

[dependencies]
log = "0.4"
riscv = "0.16"
sbi-rt = { version = "0.0.3", features = ["legacy"] }
axconfig-macros = "0.2"
axcpu = { version = "=0.3.0-preview.8" }
axplat = { version = "=0.3.1-pre.6" }
