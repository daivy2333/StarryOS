[package]
name = "axfs-ng"
version = "0.3.0-preview.2"
edition = "2024"
authors = ["Mivik <mivikq@gmail.com>"]
description = "ArceOS filesystem module"
license = "Apache-2.0"
homepage = "https://github.com/Starry-OS"

[features]
fat = ["dep:fatfs"]
ext4 = ["dep:lwext4_rust"]
times = []
std = ["lwext4_rust?/std"]

[dependencies]
axalloc = { version = "=0.3.0-preview.2" }
axdriver = { version = "=0.3.0-preview.2", default-features = false, features = ["block", "bus-mmio"] }
axerrno = { version = "0.2" }
axfs-ng-vfs = { version = "0.1.1" }
axhal = { version = "=0.3.0-preview.2" }
axio = { version = "0.3.0-pre.1", features = ["alloc"] }
axpoll = { version = "0.1" }
axsync = { version = "=0.3.0-preview.2" }
bitflags = "2.10"
cfg-if = "1.0"
chrono = { version = "0.4.40", default-features = false }
intrusive-collections = "0.9"
kspin = { version = "0.1" }
log = "0.4"
lru = "0.16"
scope-local = { version = "0.1" }
slab = { version = "0.4", default-features = false }
spin = { version = "0.10", default-features = false, features = ["mutex"] }

lwext4_rust = { version = "0.2.0", optional = true }
fatfs = { version = "0.5", default-features = false, optional = true }

[lib]
name = "axfs_ng"
path = "src/lib.rs"
